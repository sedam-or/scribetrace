<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <!-- 
    ScribeTrace Official Logo (Dark Theme / Inverted)
    100% Original Vector Art (Not derived from any icon set)
    Motifs (BRAND.md §6): Stacked reading strata, scholar's margin rule, and timeline trace.
    High contrast against dark backgrounds (#0f172a / GitHub dark mode).
  -->
  <style>
    .st-stroke-dark { stroke: #f8fafc; stroke-linecap: round; stroke-linejoin: round; }
    .st-fill-dark { fill: #f8fafc; }
    .st-wordmark-dark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.035em;
      fill: #f8fafc;
    }
    .st-sub-dark {
      font-weight: 400;
      fill: #cbd5e1;
    }
  </style>

  <!-- Brand Mark: Strata Layers & Margin Trace (x=4, y=4) -->
  <g class="st-stroke-dark" transform="translate(4, 4)">
    <!-- Scholar's Margin Guide Rule -->
    <line x1="12" y1="6" x2="12" y2="34" stroke="#94a3b8" stroke-width="1.75" opacity="0.45" />

    <!-- Layer 1: Earliest Reading Layer (Fading ink / dashed) -->
    <line x1="18" y1="11" x2="36" y2="11" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.65" />

    <!-- Layer 2: Middle Milestone Reading Layer -->
    <line x1="18" y1="20" x2="38" y2="20" stroke="#e2e8f0" stroke-width="2.5" opacity="0.85" />

    <!-- Layer 3: Base / Current Reading Layer -->
    <line x1="18" y1="29" x2="34" y2="29" stroke="#f8fafc" stroke-width="2.75" />

    <!-- The Scribe Margin Trace (Fluid loop connecting reading layers) -->
    <path d="M7 11 C 7 7, 12 7, 12 11 L 12 24 C 12 29, 6 29, 6 33 C 6 36, 12 36, 15 33" stroke="#60a5fa" stroke-width="2.5" />
    
    <!-- Active Milestone Trace Anchor (Terminal focus node) -->
    <circle cx="18" cy="29" r="2.75" fill="#38bdf8" stroke="none" />
    <!-- Secondary Milestone Node on Middle Layer -->
    <circle cx="12" cy="20" r="2" fill="#93c5fd" stroke="none" />
  </g>

  <!-- Wordmark: ScribeTrace (High-contrast white for dark mode) -->
  <g transform="translate(56, 33)">
    <text class="st-wordmark-dark">Scribe<tspan class="st-sub-dark">Trace</tspan></text>
  </g>
</svg>
