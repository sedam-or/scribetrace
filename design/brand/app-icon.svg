<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 
    ScribeTrace Official Application Icon
    100% Original Vector Art (Not derived from any icon set / Lucide / Feather / FontAwesome)
    Motifs (BRAND.md §6): Reading Strata (Stacked Layers), Scholar's Margin Rule, and Scribe Margin Trace.
    High legibility from 512px down to 16px.
  -->
  <defs>
    <!-- Background Gradient for Continuous Desktop Squircle -->
    <linearGradient id="st-icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Trace Gradient: Fading Past Ink into Crisp Present Ink -->
    <linearGradient id="st-trace-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="st-node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Desktop App Squircle (macOS / Linux standard continuous curve) -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#st-icon-bg)" stroke="#334155" stroke-width="4" />

  <!-- Inner Brand Mark: Strata & Margin Trace Geometry -->
  <g transform="translate(112, 104)">
    <!-- Scholar's Margin Guide Rule (Vertical spine) -->
    <line x1="80" y1="40" x2="80" y2="280" stroke="#475569" stroke-width="14" stroke-linecap="round" opacity="0.45" />

    <!-- Layer 1: Earliest Reading Layer (Fading ink / dashed texture) -->
    <line x1="128" y1="72" x2="260" y2="72" stroke="#64748b" stroke-width="20" stroke-linecap="round" stroke-dasharray="8 14" opacity="0.6" />

    <!-- Layer 2: Middle Milestone Reading Layer (Semi-opaque) -->
    <line x1="128" y1="152" x2="276" y2="152" stroke="#94a3b8" stroke-width="20" stroke-linecap="round" opacity="0.8" />

    <!-- Layer 3: Current Reading Layer (Sharp, solid, high-contrast) -->
    <line x1="128" y1="232" x2="248" y2="232" stroke="#f8fafc" stroke-width="22" stroke-linecap="round" />

    <!-- The Scribe Margin Trace (Fluid marginalia loop connecting milestones) -->
    <path d="M48 72 C 48 40, 80 40, 80 72 L 80 180 C 80 224, 40 224, 40 256 C 40 288, 80 288, 104 260" 
          fill="none" stroke="url(#st-trace-grad)" stroke-width="18" stroke-linecap="round" />

    <!-- Secondary Milestone Node on Middle Layer -->
    <circle cx="80" cy="152" r="16" fill="#38bdf8" stroke="#0f172a" stroke-width="6" />

    <!-- Current Milestone Anchor Node (Solid focus node on Layer 3) -->
    <circle cx="128" cy="232" r="22" fill="#2563eb" stroke="#f8fafc" stroke-width="6" filter="url(#st-node-glow)" />

    <!-- Subtle Trace Dot on Earliest Layer -->
    <circle cx="48" cy="72" r="12" fill="#60a5fa" opacity="0.75" />
  </g>
</svg>
