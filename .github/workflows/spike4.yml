name: Spike 4 (Tauri WebView)

on:
  workflow_dispatch:
  push:
    paths:
      - 'spikes/tauri-webview/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-spike:
    name: Build & Benchmark Spike 4 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0

      - name: Linux system dependencies (WebKitGTK & Tauri build deps)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node and pnpm dependencies
        shell: bash
        run: |
          cd spikes/tauri-webview
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install

      - name: Build Tauri WebView spike
        shell: bash
        run: |
          if [ -d "spikes/tauri-webview" ] && [ -f "spikes/tauri-webview/Cargo.toml" ]; then
            cd spikes/tauri-webview
            cargo build --release
          else
            echo "No Cargo.toml in spikes/tauri-webview; skipping Rust build."
          fi

      - name: Measure empty Stage 1 shell (Part A)
        shell: bash
        run: |
          echo "=== SPIKE-4 Part A: Empty Stage 1 Shell Metrics ==="
          bin_path=""
          if [ -f "spikes/tauri-webview/target/release/scribetrace-spike-tauri-webview" ]; then
            bin_path="spikes/tauri-webview/target/release/scribetrace-spike-tauri-webview"
          elif [ -f "spikes/tauri-webview/target/release/scribetrace-spike-tauri-webview.exe" ]; then
            bin_path="spikes/tauri-webview/target/release/scribetrace-spike-tauri-webview.exe"
          fi
          if [ -n "$bin_path" ]; then
            bin_bytes=$(wc -c < "$bin_path" | tr -d ' ')
            bin_mb=$(python3 -c "print(round($bin_bytes / (1024*1024), 2))" 2>/dev/null || python -c "print(round($bin_bytes / (1024*1024), 2))")
            echo "Release Binary Path: $bin_path"
            echo "Release Binary Size: $bin_mb MB ($bin_bytes bytes)"
            echo "Stage 1 installer/binary budget: <= 20 MB"
          else
            echo "Release binary not found"
          fi

      - name: Run measurement / benchmark script (Part B)
        shell: bash
        run: |
          chmod +x spikes/tauri-webview/measure.sh spikes/tauri-webview/measure.py
          ./spikes/tauri-webview/measure.sh
