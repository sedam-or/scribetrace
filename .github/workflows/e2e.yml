name: Linux E2E (Real Window)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-linux:
    name: Linux E2E Real Window under Xvfb
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0

      - name: Install Linux system dependencies (WebKitGTK, WebKitWebDriver, Xvfb)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb xdotool build-essential curl libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache tauri-driver binary
        id: cache-tauri-driver
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cargo/bin/tauri-driver
          key: ${{ runner.os }}-tauri-driver-v2

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build UI assets
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build ScribeTrace release binary
        shell: bash
        run: |
          if [ -f "src-tauri/Cargo.toml" ] || [ -f "Cargo.toml" ]; then
            cargo build --release -p scribetrace-shell --features custom-protocol
            if strings target/release/scribetrace | grep -E "SCRIBETRACE_TEST_WORKSPACE|--project-dir"; then
              echo "ERROR: Release binary contains SEC-37 bypass strings (SCRIBETRACE_TEST_WORKSPACE or --project-dir)"
              exit 1
            fi
          fi

      - name: Run Linux E2E Test Suite under Xvfb
        shell: bash
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          NO_AT_BRIDGE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          chmod +x e2e/run-linux.sh
          ./e2e/run-linux.sh --release
