[package]
name = "scribetrace-spike-tauri-webview"
version = "0.1.0"
edition = "2021"
authors = ["sedam-or and ScribeTrace Contributors"]
license = "Apache-2.0"

[dependencies]
tauri = { version = "2.0", default-features = false, features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2.0", default-features = false }
