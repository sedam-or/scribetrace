name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-spikes:
    name: Spikes Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0
        with:
          components: rustfmt, clippy

      - name: Linux system dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run Cargo checks on all spikes
        shell: bash
        run: |
          found=0
          for manifest in spikes/*/Cargo.toml; do
            if [ -f "$manifest" ]; then
              found=1
              manifest_dir=$(dirname "$manifest")
              echo "=== Checking $manifest_dir ==="
              (
                cd "$manifest_dir"
                cargo fmt --check
                cargo clippy --all-targets -- -D warnings
                cargo test --verbose
              )
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No spike manifests found."
          fi

      - name: Transitive crate count and rustls guard
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "=== Verifying transitive crate count and rustls avoidance (TECH-OPTIMIZATION Cut 2) ==="
          if cargo tree --manifest-path spikes/tauri-webview/Cargo.toml -i rustls 2>/dev/null; then
            echo "Error: Forbidden crate 'rustls' detected in spikes/tauri-webview dependencies!" >&2
            exit 1
          fi
          echo "Verified: 0 rustls dependencies found."
          
          for item in "spikes/log-merge:26" "spikes/purge:23" "spikes/tauri-webview:375"; do
            dir="${item%%:*}"
            max="${item##*:}"
            if [ -f "$dir/Cargo.toml" ]; then
              count=$(cargo tree --manifest-path "$dir/Cargo.toml" -e normal --prefix none | sort -u | wc -l)
              echo "$dir crate count: $count (limit: $max)"
              if [ "$count" -gt "$max" ]; then
                echo "Error: $dir crate count ($count) exceeds +20% ceiling ($max)!" >&2
                exit 1
              fi
            fi
          done
          echo "All crate count guards passed."

  # ---- The real workspace (src-core, src-tauri, src, test-support). Rules: docs/DEFINITION-OF-DONE.md ----
  workspace:
    name: Linux tests, lint, and gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Cargo tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny,cargo-audit,cargo-llvm-cov

      - name: Linux system dependencies (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: UI install, lint, test, build
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

      - name: Rust format, clippy, tests
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Core coverage (line >= 80%)
        run: cargo llvm-cov -p scribetrace-core --locked --fail-under-lines 80 --summary-only

      - name: Supply chain (deny, audit)
        run: |
          cargo deny check
          cargo audit --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0429

      - name: Architecture and budget gates
        run: ./tools/check-gates.sh

  workspace-other-os:
    name: Cross-platform tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: UI build, then Rust tests
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          cargo test --workspace --locked

  docs-lint:
    name: Documentation Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check markdown links with Lychee
        uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a6 # v2.3.0
        with:
          args: --exclude-all-private --exclude '^(mailto:|zotero:|scribetrace:)' --verbose '**/*.md'
          fail: false
