name: Release (Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Linux Release (AppImage + deb)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm and install dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Build frontend distribution
        run: pnpm build

      - name: Build Tauri release bundles (deb + AppImage)
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          pnpm tauri build -b deb,appimage

      - name: Verify bundle sizes against budget (<= 20 MB)
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp target/release/bundle/deb/*.deb release-artifacts/
          cp target/release/bundle/appimage/*.AppImage release-artifacts/
          ls -lh release-artifacts/
          
          # Check size budget <= 20 MB (20,971,520 bytes)
          BUDGET_BYTES=20971520
          for f in release-artifacts/*; do
            SIZE=$(stat -c%s "$f")
            echo "Artifact: $f, Size: $SIZE bytes (budget: $BUDGET_BYTES bytes)"
            if [ "$SIZE" -gt "$BUDGET_BYTES" ]; then
              echo "ERROR: Artifact $f exceeds 20 MB budget ($SIZE bytes > $BUDGET_BYTES bytes)"
              exit 1
            fi
          done

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          python3 - << 'EOF'
          import re
          with open("CHANGELOG.md", "r") as f:
              content = f.read()
          m = re.search(r"## Release notes draft.*?(?=\n## |\Z)", content, re.DOTALL)
          notes = m.group(0).strip() if m else "ScribeTrace Linux Release"
          with open("release-notes.md", "w") as out:
              out.write(notes + "\n")
          EOF
          cat release-notes.md

      - name: Create Draft Release on GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: false
          body_path: release-notes.md
          files: |
            release-artifacts/*.deb
            release-artifacts/*.AppImage
            release-artifacts/SHA256SUMS
