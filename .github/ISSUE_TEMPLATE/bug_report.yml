name: Bug Report
description: Create a report to help us reproduce and fix an issue in ScribeTrace.
title: "fix: [short bug description]"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Please ensure you are not reporting a security vulnerability here (use `SECURITY.md` instead).
  - type: input
    id: version
    attributes:
      label: ScribeTrace Version
      description: What version of ScribeTrace are you running? (Run `scribetrace --version`)
      placeholder: "e.g., v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (AppImage / Flatpak / deb)
        - macOS (Apple Silicon M1/M2/M3)
        - macOS (Intel x86_64)
        - Windows 10/11 (x64)
    validations:
      required: true
  - type: input
    id: zotero-version
    attributes:
      label: Zotero Version (if applicable)
      description: What version of Zotero are you using?
      placeholder: "e.g., Zotero 7.0.7"
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open ScribeTrace with project folder X
        2. Click 'Refresh from Zotero'
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Terminal Output
      description: Please copy relevant log messages (redact any private document titles or personal paths).
      render: shell
