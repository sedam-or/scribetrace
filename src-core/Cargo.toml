[package]
name = "scribetrace-core"
description = "ScribeTrace core: domain, application use cases and adapters. No UI, no Tauri, no TLS."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }
# Plain HTTP to 127.0.0.1 only: no TLS stack on purpose (TECH-OPTIMIZATION cut 2).
ureq = { version = "3", default-features = false }

[dev-dependencies]
proptest = "1"
tempfile = "3"
zotero-standin = { path = "../test-support/zotero-standin" }
