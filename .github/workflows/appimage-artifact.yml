name: AppImage Artifact Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm and install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build -b appimage

      - name: Check AppImage output and report size
        run: |
          shopt -s nullglob
          images=(target/release/bundle/appimage/*.AppImage)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "Expected one AppImage, found ${#images[@]}" >&2
            exit 1
          fi
          ls -lh "${images[0]}"
          stat -c 'AppImage size: %s bytes' "${images[0]}"

      - name: Upload AppImage build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scribetrace-appimage-${{ github.run_id }}
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 3
