name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-spikes:
    name: Spikes Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0
        with:
          components: rustfmt, clippy

      - name: Linux system dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run Cargo checks on all spikes
        shell: bash
        run: |
          found=0
          for manifest in spikes/*/Cargo.toml Cargo.toml; do
            if [ -f "$manifest" ]; then
              found=1
              manifest_dir=$(dirname "$manifest")
              echo "=== Checking $manifest_dir ==="
              (
                cd "$manifest_dir"
                cargo fmt --check
                cargo clippy --all-targets -- -D warnings
                cargo test --verbose
              )
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No Cargo.toml files found yet; skipping Rust checks for initial scaffold."
          fi

  docs-lint:
    name: Documentation Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check markdown links with Lychee
        uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a6 # v2.3.0
        with:
          args: --exclude-all-private --exclude '^(mailto:|zotero:|scribetrace:)' --verbose '**/*.md'
          fail: false
